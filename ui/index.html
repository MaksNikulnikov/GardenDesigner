<div id="game-ui">
  <div class="top-bar">
    <div id="resources" class="resources">
      <div id="res-item" class="res-item ui-bubble">
        <img src="assets/images/money.png" alt="money" class="icon" />
        <span id="coin-amount">0</span>
      </div>
      <div class="res-item ui-bubble">
        <img src="assets/images/corn.png" alt="corn" />
        <span id="res-corn">0</span>
      </div>
      <div class="res-item ui-bubble">
        <img src="assets/images/eggs.png" alt="egg" />
        <span id="res-eggs">0</span>
      </div>
    </div>
    <div id="day-night" class="day-night ui-bubble">
      <div class="time-row">
        <img id="day-night-icon" src="assets/images/sun.png" alt="Day" />
        <span id="clock">8 a.m.</span>
      </div>

      <div id="toggle-switch" class="toggle-switch"></div>
    </div>
  </div>

  <div class="main-buttons">
    <button id="btn-build" class="btn main-btn">
      <img src="assets/images/build.png" alt="Build" />
      <span>Build</span>
    </button>

    <button id="btn-plants" class="btn main-btn">
      <img src="assets/images/plants.png" alt="Plants" />
      <span>Plants</span>
    </button>

    <button id="btn-animals" class="btn main-btn disabled">
      <img src="assets/images/animals.png" alt="Animals" />
      <span>Animals</span>
    </button>
  </div>

  <div id="sub-buttons" class="sub-buttons">
    <!-- 🏗️ Build -->
    <button id="sub-garden" class="btn sub-btn hidden">
      <img src="assets/images/garden.png" alt="Garden" />
      <span>Garden</span>
    </button>

    <button id="sub-pen" class="btn sub-btn hidden">
      <img src="assets/images/pen.png" alt="Animal Pen" />
      <span>Pen</span>
    </button>

    <!-- 🌿 Plants -->
    <button id="sub-corn" class="btn sub-btn hidden">
      <img src="assets/images/corn.png" alt="Corn" />
      <span>Corn</span>
    </button>

    <button id="sub-grape" class="btn sub-btn hidden">
      <img src="assets/images/grape.png" alt="Grape" />
      <span>Grape</span>
    </button>

    <button id="sub-tomato" class="btn sub-btn hidden">
      <img src="assets/images/tomato.png" alt="Tomato" />
      <span>Tomato</span>
    </button>

    <button id="sub-strawberry" class="btn sub-btn hidden">
      <img src="assets/images/strawberry.png" alt="Strawberry" />
      <span>Strawberry</span>
    </button>

    <!-- 🐔 Animals -->
    <button id="sub-chicken" class="btn sub-btn hidden">
      <img src="assets/images/chicken.png" alt="Chicken" />
      <span>Chicken</span>
    </button>

    <button id="sub-sheep" class="btn sub-btn hidden">
      <img src="assets/images/sheep.png" alt="Sheep" />
      <span>Sheep</span>
    </button>

    <button id="sub-cow" class="btn sub-btn hidden">
      <img src="assets/images/cow.png" alt="Cow" />
      <span>Cow</span>
    </button>
  </div>

  <!-- 📲 CTA -->
  <button id="cta-button" class="cta-button hidden">Download Now</button>
</div>
